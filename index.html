<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>My APK Library</title>
<style>
:root{color-scheme:dark;--bg:#080f1d;--panel:#142238;--panel2:#0e1a2d;--blue:#087df5;--text:#eef5ff;--muted:#9eb1cb}
*{box-sizing:border-box}body{margin:0;font-family:system-ui,Segoe UI,Arial,sans-serif;background:linear-gradient(135deg,#07101c,#0c1830);color:var(--text)}
header{padding:28px 5vw 20px;border-bottom:2px solid #1766c3;display:flex;gap:20px;align-items:center;flex-wrap:wrap}
.logo{font-size:52px}h1{margin:0;font-size:clamp(26px,4vw,44px)}header p{margin:5px 0 0;color:var(--muted)}
main{padding:24px 5vw}input,select{background:var(--panel2);color:var(--text);border:1px solid #334c70;border-radius:12px;padding:14px;font-size:16px}
.controls{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:22px}.controls input{flex:1;min-width:220px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px}
.card{background:linear-gradient(145deg,var(--panel),#101a2b);border:1px solid #294264;border-radius:18px;padding:18px;display:flex;flex-direction:column;min-height:230px}
.top{display:flex;gap:14px;align-items:center}.icon{width:64px;height:64px;display:grid;place-items:center;background:#263b60;border-radius:15px;font-size:32px;flex-shrink:0}
.name{font-weight:700;font-size:18px}.version{color:var(--muted);font-size:14px}.desc{color:#c6d6ee;margin:18px 0 auto}
.download{display:block;text-decoration:none;text-align:center;margin-top:18px;background:linear-gradient(90deg,#0875ed,#1494ff);color:white;font-weight:700;padding:13px;border-radius:12px}
.download:hover{filter:brightness(1.1)}.empty{padding:30px;color:var(--muted);text-align:center}
footer{padding:22px 5vw;color:var(--muted);border-top:1px solid #253a5a;margin-top:25px}
@media(min-width:900px){body{font-size:18px}.card{min-height:260px}}
</style>
</head>
<body>
<header><div class="logo">🤖</div><div><h1>My <span style="color:#1292ff">APK</span> Library</h1><p>Your personal download hub · simple · organized</p></div></header>
<main>
<div class="controls">
<input id="search" type="search" placeholder="Search apps…" aria-label="Search apps">
<select id="category" aria-label="Filter category"><option value="">All categories</option></select>
</div>
<div id="grid" class="grid"></div>
<div id="empty" class="empty" hidden>No apps match your search.</div>
</main>
<footer>Only install APKs from sources you trust. Files can be modified or replaced by their owners.</footer>
<script>
const grid=document.getElementById('grid'), search=document.getElementById('search'), category=document.getElementById('category'), empty=document.getElementById('empty');
let apps=[];
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function render(){
 const term=search.value.toLowerCase().trim(), cat=category.value;
 const filtered=apps.filter(a=>(!cat||a.category===cat)&&(`${a.name} ${a.description} ${a.category}`.toLowerCase().includes(term)));
 grid.innerHTML=filtered.map(a=>`<article class="card"><div class="top"><div class="icon">${esc(a.icon||'📦')}</div><div><div class="name">${esc(a.name)}</div><div class="version">${esc(a.version||'Version not listed')} · ${esc(a.category||'Other')}</div></div></div><p class="desc">${esc(a.description||'')}</p><a class="download" href="${esc(a.url)}" target="_blank" rel="noopener">⬇ Download APK</a></article>`).join('');
 empty.hidden=filtered.length!==0;
}
fetch('./apps.json').then(r=>{if(!r.ok)throw new Error('Could not load catalog');return r.json()}).then(data=>{
 apps=Array.isArray(data)?data:[];
 [...new Set(apps.map(a=>a.category).filter(Boolean))].sort().forEach(c=>category.add(new Option(c,c)));
 render();
}).catch(()=>{grid.innerHTML='<p class="empty">Catalog could not be loaded. Check that apps.json is uploaded beside index.html.</p>'});
search.addEventListener('input',render);category.addEventListener('change',render);
</script>
</body>
</html>
